name: Sync status (read-only)

# Relatório manual da distância entre develop e main. Não abre PR, não habilita auto-merge e não
# escreve no repositório: a integração em main é feita por release/* ou hotfix/* revisadas, com a
# CI (workflow ci) verde no SHA integrado. A CI do produto é o workflow "ci", não este.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare develop with main
        run: |
          set -eu
          git fetch origin main develop
          ahead=$(git rev-list --count origin/main..origin/develop)
          behind=$(git rev-list --count origin/develop..origin/main)
          printf 'develop está %s commit(s) à frente e %s atrás de main.\n' "$ahead" "$behind"
          git log --oneline origin/main..origin/develop | head -50
