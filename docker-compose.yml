services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  order-service:
    build:
      context: .
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-orders}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-orders}
      SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:-20}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  order-admin:
    build:
      context: ./admin
    container_name: order-admin
    ports:
      - "${ADMIN_PORT:-9086}:80"
    depends_on:
      - order-service

volumes:
  pgdata:
