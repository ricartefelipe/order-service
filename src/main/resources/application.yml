server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: order-service

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONN_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      # Moeda atribuída aos pedidos gravados antes da versão 2.0.0 (changeset 002).
      legacy-currency: ${ORDERS_LEGACY_CURRENCY:BRL}
      # Origem atribuída aos pedidos gravados antes da versão 2.0.0. Só esse cliente os enxerga.
      legacy-origin: ${ORDERS_LEGACY_ORIGIN:legacy}

orders:
  default-currency: ${ORDERS_DEFAULT_CURRENCY:BRL}
  auth:
    # Emissor e audiência exigidos em todo token de cliente.
    issuer: ${ORDERS_AUTH_ISSUER:order-service-local}
    audience: ${ORDERS_AUTH_AUDIENCE:order-service}
    # Exatamente um dos dois: JWKS do provedor de identidade (client credentials) ou segredo HMAC (>= 32 bytes).
    jwks-uri: ${ORDERS_AUTH_JWKS_URI:}
    secret: ${ORDERS_AUTH_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Order microservice (idempotent ingestion, PostgreSQL, Liquibase)
